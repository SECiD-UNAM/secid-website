name: Continuous Integration

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    # feature/hub is the integration branch for beta: PRs into it must be
    # tested too, otherwise a fix/* branch gets no CI until it reaches main.
    branches: [main, develop, feature/hub]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.12.0'

jobs:
  # Static Analysis and Code Quality
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type checking
        run: npm run type-check

      - name: ESLint
        run: npm run lint
        continue-on-error: true

      - name: Prettier formatting check
        run: npm run format:check

  # Unit and Integration Tests
  test:
    name: Unit & Integration Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # BLOCKING. The collection hang (broken Heroicons mock) is fixed; the
    # full suite now completes in ~90s. 13 pre-existing broken test files
    # are quarantined via vitest.config.ts `exclude` (tracked for rewrite
    # in docs/known-issues/test-suite-hang.md) so this job gates merges on
    # the real, passing tests.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Tests that import from functions/src/* (e.g. alternate-email.test.ts,
      # merge-engine.audit-log.test.ts) resolve `firebase-functions/v2/*` and
      # `firebase-admin` against functions/node_modules/, which `npm ci` at
      # the repo root does not populate.
      - name: Install Cloud Functions dependencies
        run: cd functions && npm ci

      # `vitest run` include globs already cover tests/unit, tests/integration
      # and tests/build. Sharded across 4 parallel runners; the global
      # Firebase stub in src/test/setup.ts keeps Firebase-touching tests from
      # opening (and leaking) real connections, so no emulator is needed.
      - name: Run unit & integration tests (shard ${{ matrix.shard }}/4)
        run: npx vitest run --shard=${{ matrix.shard }}/4
        env:
          CI: true
          NODE_ENV: test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  # Firestore security rules. One backend serves beta AND production, so a
  # rules change shipped from either branch applies to both sites at once.
  # tests/rules/* skip silently without an emulator; this job boots one so
  # the suite actually gates merges.
  rules:
    name: Firestore Rules Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # The Firestore emulator is a Java program.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Port 8088 matches firebase.json `emulators.firestore.port`, which
      # is also the suite's default FIRESTORE_EMULATOR_HOST.
      - name: Run rules tests against the Firestore emulator
        run: |
          npx firebase-tools emulators:exec --only firestore \
            --project secid-rules-test \
            "npx vitest run tests/rules"
        env:
          CI: true
          NODE_ENV: test
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8088

  # Build validation
  build:
    name: Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npx astro build
        env:
          NODE_ENV: production

      - name: Check Cloud Functions build
        run: |
          cd functions && npm ci && npm run build
        continue-on-error: true

  # End-to-End Tests (only on PRs and main): the full suite against the
  # Firebase emulators with seeded users (docs/ROADMAP.md A4). The blocking
  # gate is still the e2e-smoke job below.
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # The Firestore emulator is a Java program.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # The functions emulator loads functions/lib (tsc output) and resolves
      # firebase-admin/firebase-functions from functions/node_modules, which
      # the root `npm ci` does not populate.
      - name: Install and build Cloud Functions
        run: cd functions && npm ci && npm run build

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The build is static, so PUBLIC_* vars are baked in here.
      # src/lib/firebase.ts connects to the emulators (ports from
      # firebase.json: auth 9099, firestore 8088, storage 9199) only when
      # PUBLIC_USE_EMULATORS=true; the project id defaults to the demo
      # project scripts/seed-emulator.js seeds.
      - name: Build application (emulator mode)
        run: npx astro build
        env:
          NODE_ENV: production
          PUBLIC_USE_EMULATORS: 'true'

      # Informational until the remaining suites are rewritten against the
      # real UI (see test.describe.skip reasons under tests/e2e). The
      # functions emulator runs too, so the blocking `onUserCreate` trigger
      # and callables such as `completeRegistration` are live (PR #114 moved
      # the FieldValue/Timestamp statics to `firebase-admin/firestore`, which
      # the emulator's firebase-admin stub does expose). The demo project
      # needs no credentials; Google Groups sync only logs an error. The
      # E2E_QA_* vars unlock the journey-* specs with the seeded accounts;
      # E2E_QA_NUMERO_CUENTA stays unset until journey-B is rewritten
      # against the real signup wizard (see its header).
      - name: Run full E2E suite against the emulators (informational)
        run: |
          npx firebase-tools emulators:exec --only auth,firestore,storage,functions \
            --project demo-secid-alumni \
            "npm run seed && npx playwright test --project=${{ matrix.browser }} --reporter=line,json"
        env:
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
          E2E_QA_EMAIL: member1@alumno.unam.mx
          E2E_QA_PASSWORD: member123456
          E2E_QA_ADMIN_EMAIL: admin@secid.mx
          E2E_QA_ADMIN_PASSWORD: admin123456
        continue-on-error: true

      - name: Summarize pass rate
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const file = "test-results/report.json";
            if (!fs.existsSync(file)) {
              console.log("## E2E (${{ matrix.browser }})\n\nNo report.json produced.");
              process.exit(0);
            }
            const { stats } = JSON.parse(fs.readFileSync(file, "utf8"));
            const ran = stats.expected + stats.unexpected + stats.flaky;
            const rate = ran ? Math.round((100 * (stats.expected + stats.flaky)) / ran) : 0;
            console.log(`## E2E (${{ matrix.browser }}) against emulators\n`);
            console.log(`| passed | failed | flaky | skipped | pass rate |`);
            console.log(`|---:|---:|---:|---:|---:|`);
            console.log(`| ${stats.expected} | ${stats.unexpected} | ${stats.flaky} | ${stats.skipped} | ${rate}% of ${ran} run |`);
          ' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Blocking e2e smoke against the production build: hydration + public pages.
  e2e-smoke:
    name: E2E Tests (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npx astro build
        env:
          NODE_ENV: production

      - name: Run E2E smoke
        run: npx playwright test --project=smoke
        env:
          CI: true

      - name: Upload smoke results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-smoke-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Dependency Check
  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run dependency check
        run: npm audit --audit-level=high --production
        continue-on-error: true

  # Test Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [code-quality, test, build]
    if: always()
    steps:
      - name: Generate test summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Unit & Integration Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build Validation: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY

      # Make the summary job an honest aggregate: it used to pass even when
      # the unit tests failed (if: always() + echo only).
      - name: Fail if tests or build failed
        if: needs.test.result != 'success' || needs.build.result != 'success'
        run: |
          echo "::error::Unit tests: ${{ needs.test.result }}, build: ${{ needs.build.result }}"
          exit 1
