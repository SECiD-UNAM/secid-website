name: Deploy to Production (Firebase Hosting)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: '22.12.0'

permissions:
  contents: read

jobs:
  # ── Build ────────────────────────────────────────────────────────────────
  deploy-hosting:
    name: Build & Deploy Hosting (secid.mx)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npx astro build
        env:
          NODE_ENV: production
          SITE_URL: https://secid.mx
          PUBLIC_BUILD_SHA: ${{ github.sha }}
          # Same Firebase project as beta — same credentials. The secrets
          # were created as STAGING_* when beta was the only environment;
          # the un-prefixed names are preferred and the STAGING_* ones are
          # a fallback so they can be renamed without an outage.
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || secrets.STAGING_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || secrets.STAGING_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || secrets.STAGING_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET || secrets.STAGING_FIREBASE_STORAGE_BUCKET }}
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID || secrets.STAGING_FIREBASE_MESSAGING_SENDER_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || secrets.STAGING_FIREBASE_APP_ID }}
          PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID || secrets.STAGING_FIREBASE_MEASUREMENT_ID }}
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY || secrets.STAGING_STRIPE_PUBLISHABLE_KEY }}
          # Browser push notifications (B2). See deploy-beta.yml for context.
          PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY || secrets.STAGING_FIREBASE_VAPID_KEY }}
          # reCAPTCHA v3 site key (#48). See deploy-beta.yml for context.
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY || secrets.STAGING_RECAPTCHA_SITE_KEY }}

      # Production is a SECOND Firebase Hosting site in the same project
      # (beta.secid.mx is the project's default site). GitHub Pages cannot
      # serve this app: it has no rewrites (the dynamic detail routes and
      # the /api/forms/* function rewrites in firebase.json would 404) and
      # sends none of the firebase.json security headers.
      #
      # firebase.json stays single-site so beta and prod share one config;
      # only `hosting.site` is pointed at the prod site for this deploy.
      - name: Target the production Hosting site
        env:
          PROD_SITE: ${{ vars.FIREBASE_PROD_HOSTING_SITE }}
        run: |
          if [ -z "$PROD_SITE" ]; then
            echo "::error::Repo variable FIREBASE_PROD_HOSTING_SITE is not set. See docs/DEPLOYMENT.md (Production cutover)."
            exit 1
          fi
          jq --arg site "$PROD_SITE" '.hosting.site = $site' firebase.json > firebase.prod.json
          mv firebase.prod.json firebase.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting (production site)
        run: |
          set -o pipefail
          npx firebase-tools deploy --only hosting \
            --project ${{ secrets.FIREBASE_PROJECT_ID || secrets.STAGING_FIREBASE_PROJECT_ID }} \
            --non-interactive 2>&1

  # ── Functions + Rules (Firebase — same project as beta) ──────────────────
  # One project backs beta AND prod, so exactly one branch may deploy the
  # backend (it also writes APP_URL, which ends up in user-facing email
  # links). The repo variable BACKEND_DEPLOYED_FROM_MAIN picks that branch:
  # unset → deploy-beta.yml (feature/hub) deploys it and this job is
  # skipped; 'true' → this job deploys it and deploy-beta.yml skips. Set it
  # to 'true' BEFORE merging the promotion PR so there is never a window
  # with two deployers. Runs in parallel with hosting; rules are
  # backward-compatible.
  deploy-backend:
    name: Deploy Firebase Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: vars.BACKEND_DEPLOYED_FROM_MAIN == 'true'
    # Serialise against deploy-beta.yml's backend job: both target the same
    # functions/rules, and two concurrent `firebase deploy --force` runs
    # from different branches can delete each other's functions.
    concurrency:
      group: firebase-backend
      cancel-in-progress: false
    env:
      FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID || secrets.STAGING_FIREBASE_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Cloud Functions dependencies
        run: cd functions && npm ci

      # Write functions runtime env. Gen2 reads functions/.env at deploy
      # time, baking values into process.env. Closes S5 (APP_URL) and the
      # server-side half of #48 (RECAPTCHA_SECRET_KEY). File is gitignored
      # — never committed; written fresh per deploy.
      - name: Write functions runtime env (prod)
        env:
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY || secrets.STAGING_RECAPTCHA_SECRET_KEY }}
        run: |
          {
            echo "APP_URL=https://secid.mx"
            if [ -n "$RECAPTCHA_SECRET_KEY" ]; then
              echo "RECAPTCHA_SECRET_KEY=$RECAPTCHA_SECRET_KEY"
            fi
          } > functions/.env

      # Fail loud (prod). Swallowing these is how the prod Firebase project
      # ended up with completeRegistration returning 403 and unverified
      # rule state. set -o pipefail preserves output AND the real exit.
      #
      # Rules deploy BEFORE functions: rules carry the authz fixes and don't
      # depend on billing/quota, so a functions failure must never leave
      # them unshipped.
      - name: Deploy Firestore Rules & Indexes
        run: |
          set -o pipefail
          npx firebase-tools deploy --only firestore:rules,firestore:indexes \
            --project "$FIREBASE_PROJECT" --non-interactive 2>&1

      - name: Deploy Storage Rules
        run: |
          set -o pipefail
          npx firebase-tools deploy --only storage \
            --project "$FIREBASE_PROJECT" --non-interactive 2>&1

      # `--force` lets the CLI delete deployed functions this branch no
      # longer exports. With a shared backend that must be a deliberate
      # choice, never a side effect of a stale branch.
      - name: Refuse to delete functions another branch still uses
        env:
          # Intended removals: set this repo variable for one deploy, then
          # delete it (docs/runbooks/shared-backend-change.md).
          ALLOW_FUNCTION_DELETIONS: ${{ vars.ALLOW_FUNCTION_DELETIONS }}
        run: node scripts/ci/check-function-deletions.mjs --project "$FIREBASE_PROJECT"

      - name: Deploy Cloud Functions
        run: |
          set -o pipefail
          npx firebase-tools deploy --only functions \
            --project "$FIREBASE_PROJECT" --non-interactive --force 2>&1

  # ── Health check ─────────────────────────────────────────────────────────
  # Runs against the Hosting site's own .web.app URL, which is valid before
  # and after the DNS cutover, plus the shared backend. A failure here is a
  # real failure — unlike the old "GitHub Pages may be propagating" warning.
  validate:
    name: Post-deploy Health Check
    runs-on: ubuntu-latest
    needs: [deploy-hosting, deploy-backend]
    # deploy-backend is skipped until BACKEND_DEPLOYED_FROM_MAIN=true; still
    # validate hosting in that case.
    if: ${{ !cancelled() && needs.deploy-hosting.result == 'success' && needs.deploy-backend.result != 'failure' }}
    env:
      SITE_URL: https://${{ vars.FIREBASE_PROD_HOSTING_SITE }}.web.app
      FUNCTIONS_URL: https://us-central1-${{ secrets.FIREBASE_PROJECT_ID || secrets.STAGING_FIREBASE_PROJECT_ID }}.cloudfunctions.net
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Smoke-test hosting, rewrites and backend
        run: scripts/ci/smoke-test.sh "$SITE_URL" "$FUNCTIONS_URL"

      # secid.mx is served by Firebase Hosting since the DNS cutover
      # (docs/LAUNCH-CHECKLIST.md, Fase 4): a failure here means production
      # is not serving this build and the deploy must be treated as broken.
      - name: Check secid.mx serves this build
        run: scripts/ci/smoke-test.sh https://secid.mx "$FUNCTIONS_URL"
